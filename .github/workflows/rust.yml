name: ci
on: [push, pull_request]
jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
      with:
          components: rustfmt clippy
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: check formatting
      run: cargo fmt --all -- --check
    - name: check linting
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: run tests
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
    - name: run doc tests
      run: cargo test --doc
    - name: upload coverage
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
    - name: check doc
      run: cargo doc
      env:
        RUSTFLAGS: -D warnings
    - name: check cli formatting
      run: cargo fmt --manifest-path=cli/Cargo.toml --all -- --check
    - name: check cli linting
      run: cargo clippy --manifest-path=cli/Cargo.toml --all-targets --all-features -- -D warnings
      
  wasm:
    runs-on: ubuntu-latest
    steps:
    - name: install rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-emscripten
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: Check
      run: cargo check --target wasm32-unknown-emscripten
